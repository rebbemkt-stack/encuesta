<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Encuesta Rebbe Club</title>
<meta name="description" content="Ayúdanos a mejorar el Rebbe Club: 5 minutitos sobre tu dieta y tus entrenos.">
<meta property="og:title" content="Ayúdanos a mejorar el Rebbe Club 🩷">
<meta property="og:description" content="Queremos que las próximas dietas y entrenos estén hechos a vuestra medida. Son 5 minutitos.">
<meta name="theme-color" content="#F6DEE5">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Rebbe Club: rosa empolvado + burdeos, igual que la app */
:root{
  --bg:#F6DEE5; --sheet:#FDF4F7; --ink:#611B2F; --muted:#7E4C5C; --line:#E2B9C6;
  --accent:#8B2A4C; --accent-ink:#FDF4F7; --accent-soft:#F0D0DA; --error:#A03030;
  --display:"DM Serif Display", Georgia, serif;
  --body:"Poppins", "Helvetica Neue", system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:12px;display:flex;flex-direction:column;gap:8px}
.bar{height:6px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.topline{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hero{padding-block:16px 4px;display:flex;flex-direction:column;gap:12px}
.hero img{width:120px;height:auto}
.hero h1{font:400 clamp(32px,8vw,46px)/1.05 var(--display);margin:0;text-wrap:balance}
.hero h1 em{font-style:italic}
.hero p{margin:0;color:var(--muted);max-width:52ch}
form{display:flex;flex-direction:column;gap:20px;margin-top:8px}
section.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:26px}
section.sheet h2{font:400 26px var(--display);margin:0}
.q{display:flex;flex-direction:column;gap:10px;border:0;margin:0;padding:0;min-width:0}
.q legend,.q>label.qt{font-weight:600;font-size:16px;padding:0;margin-bottom:10px;display:flex;gap:8px}
.q .n{font:600 12px var(--body);color:var(--accent);background:var(--accent-soft);border-radius:99px;min-width:26px;height:22px;display:inline-grid;place-items:center;flex:none;margin-top:1px;font-variant-numeric:tabular-nums}
.q.missing legend,.q.missing>label.qt{color:var(--error)}
.hint{font-weight:400;color:var(--muted);font-size:13px}
input[type=text],textarea{width:100%;font:16px var(--body);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{min-height:96px;resize:vertical}
input[type=text]:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-block;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:15px;cursor:pointer;transition:background .15s,border-color .15s}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:360px}
.scale .chip span{display:grid;place-items:center;height:48px;padding:0;border-radius:14px;font:600 18px var(--body)}
.scale-ends{display:flex;justify-content:space-between;max-width:360px;font-size:12px;color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:10px}
.btn{font:600 17px var(--body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:16px 20px;cursor:pointer}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,.link:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.link{background:none;border:0;color:var(--accent);font:600 15px var(--body);cursor:pointer;text-decoration:underline;padding:4px}
.notice{border-radius:14px;padding:12px 14px;background:var(--accent-soft);font-size:14px}
.thanks{text-align:center;padding:40px 20px;align-items:center}
.thanks .big{font-size:52px;line-height:1}
.thanks h2{font-size:34px!important}
.thanks p{margin:0;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="topline" id="progress-label">0 de 18 respondidas</span>
    <div class="bar"><i id="bar"></i></div>
  </header>

  <div id="view-form">
    <div class="hero">
      <img src="logo.png" alt="rebbe club" width="120" height="72">
      <h1>Ayúdanos a mejorar el <em>club</em> 🩷</h1>
      <p>Queremos que las próximas dietas y entrenos estén hechos a vuestra medida. Contesta con total sinceridad, son 5 minutitos.</p>
    </div>
    <form id="form" novalidate></form>
  </div>

  <div id="view-thanks" hidden>
    <section class="sheet thanks">
      <div class="big">🩷</div>
      <h2>¡Gracias, de verdad!</h2>
      <p>Tus respuestas ya nos han llegado. Con ellas vamos a preparar las próximas dietas y entrenos.</p>
    </section>
  </div>
</div>

<script>
// Las respuestas se envían al Google Form del club (cada pregunta lleva su "entry" de Google).
const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSd5Imxa7f7Mcpnc-wAj3AjByVC0GlZpztMTiTwDIo0PMnb_gQ/formResponse";
const SECTIONS = [
  {title:"Sobre ti", qs:[
    {id:"nombre", e:694133241, t:"text", q:"Nombre", hint:"(opcional)", optional:true}
  ]},
  {title:"🥗 Tu dieta", qs:[
    {id:"dieta_nota", e:87021933, t:"scale", q:"Del 1 al 5, ¿cuánto te gusta la dieta actual?"},
    {id:"dieta_sigue", e:404912351, t:"single", q:"¿Consigues seguirla?", o:["Casi siempre","La mitad de los días","Me cuesta bastante"]},
    {id:"dieta_falta", e:1460356240, t:"multi", q:"¿Qué opciones echas en falta?", hint:"Marca todas las que quieras", other:true, o:[
      "Más opciones de desayuno","Comidas rápidas, de menos de 15 min","Tuppers para el trabajo","Opciones para comer fuera o pedir a domicilio","Snacks y meriendas","Postres y caprichos fit","Cenas ligeras","Opciones vegetarianas","Opciones sin lactosa o sin gluten","Recetas que pueda comer toda la familia","Opciones más económicas"]},
    {id:"dieta_no_gusta", e:1237234746, t:"text", q:"¿Hay alimentos que no te gustan o que no comes y aparecen en la dieta?", optional:true},
    {id:"dieta_cuesta", e:911381083, t:"multi", q:"¿Qué es lo que más te cuesta?", hint:"Puedes marcar varias", o:[
      "Las cantidades","El tiempo para cocinar","Los findes","Paso hambre","Poca variedad","Ingredientes difíciles de encontrar"]},
    {id:"dieta_formato", e:957429237, t:"single", q:"¿Cómo prefieres la dieta?", o:["Menú cerrado día a día","Opciones para intercambiar","Recetas para combinar a mi gusto"]},
    {id:"dieta_plato", e:113443322, t:"long", q:"¿Qué plato o receta te encantaría que estuviera en la próxima dieta?", optional:true}
  ]},
  {title:"💪🏼 Tus entrenos", qs:[
    {id:"entreno_nota", e:661481685, t:"scale", q:"Del 1 al 5, ¿cuánto te gustan los entrenos actuales?"},
    {id:"entreno_donde", e:1715965218, t:"single", q:"¿Dónde entrenas?", o:["En casa","En el gym","En los dos"]},
    {id:"entreno_dias", e:1382893893, t:"single", q:"¿Cuántos días a la semana entrenas?", o:["1-2","3","4","5 o más"]},
    {id:"entreno_tiempo", e:1338092199, t:"single", q:"¿Cuánto tiempo tienes para entrenar?", o:["Menos de 30 min","30-45 min","45-60 min","Más de 1 hora"]},
    {id:"entreno_dificultad", e:1256495699, t:"single", q:"¿Qué tal la dificultad?", o:["Demasiado fáciles","Perfectos","Demasiado difíciles"]},
    {id:"entreno_consigue", e:1099234182, t:"single", q:"¿Consigues hacerlos?", o:["Casi siempre","La mitad de las veces","Me cuesta bastante"]},
    {id:"entreno_falta", e:736538243, t:"multi", q:"¿Qué echas en falta en los entrenos?", hint:"Marca todas las que quieras", other:true, o:[
      "Vídeos explicando la técnica","Rutinas cortas, de menos de 30 min","Más glúteo y pierna","Más tren superior (espalda, hombro, brazos)","Más abdomen y core","Cardio y HIIT","Movilidad y estiramientos","Rutinas sin material para casa","Más directos de entreno","Rutinas para principiantes","Rutinas más avanzadas"]},
    {id:"entreno_cuesta", e:533939368, t:"multi", q:"¿Qué es lo que más te cuesta?", hint:"Puedes marcar varias", o:[
      "Encontrar tiempo","La motivación","No sé si hago bien los ejercicios","No sé qué peso usar","Me aburro de las rutinas","Dolores o lesiones"]},
    {id:"entreno_ejercicio", e:1929495907, t:"long", q:"¿Qué entreno o ejercicio te encantaría que estuviera en las próximas rutinas?", optional:true}
  ]},
  {title:"🩷 Para terminar", qs:[
    {id:"cambio", e:1894209504, t:"long", q:"Si pudieras cambiar o añadir una sola cosa al club, ¿cuál sería?", optional:true}
  ]}
];
const ALL = SECTIONS.flatMap(s=>s.qs);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DRAFT_KEY = "rebbe-encuesta-borrador";
const DONE_KEY = "rebbe-encuesta-enviada";

let state = {};
try { state = JSON.parse(localStorage.getItem(DRAFT_KEY) || "{}") || {}; } catch(e){ state = {}; }

function renderForm(){
  let n = 0, html = "";
  for (const s of SECTIONS){
    html += `<section class="sheet"><h2>${s.title}</h2>`;
    for (const q of s.qs){
      n++;
      const num = `<span class="n">${n}</span>`;
      const hint = q.hint ? ` <span class="hint">${esc(q.hint)}</span>` : "";
      if (q.t==="text" || q.t==="long"){
        const field = q.t==="text"
          ? `<input type="text" id="f-${q.id}" data-q="${q.id}" maxlength="300" value="${esc(state[q.id]||"")}">`
          : `<textarea id="f-${q.id}" data-q="${q.id}" maxlength="2000">${esc(state[q.id]||"")}</textarea>`;
        html += `<div class="q" data-box="${q.id}"><label class="qt" for="f-${q.id}">${num}<span>${esc(q.q)}${hint}</span></label>${field}</div>`;
      } else {
        const type = q.t==="multi" ? "checkbox" : "radio";
        const opts = q.t==="scale" ? ["1","2","3","4","5"] : q.o.concat(q.other ? ["Otro"] : []);
        const cur = state[q.id];
        const isOn = v => Array.isArray(cur) ? cur.includes(v) : cur===v;
        const chips = opts.map((v,i)=>`<label class="chip"><input type="${type}" id="f-${q.id}-${i}" name="${q.id}" value="${esc(v)}" data-q="${q.id}"${isOn(v)?" checked":""}><span>${esc(v)}</span></label>`).join("");
        html += `<fieldset class="q" data-box="${q.id}"><legend>${num}<span>${esc(q.q)}${hint}</span></legend>`
          + (q.t==="scale" ? `<div class="scale">${chips}</div><div class="scale-ends"><span>Nada</span><span>Me encanta</span></div>` : `<div class="chips">${chips}</div>`)
          + (q.other ? `<input type="text" id="f-${q.id}_otro" data-q="${q.id}_otro" placeholder="Cuéntanos qué otra cosa" maxlength="300" value="${esc(state[q.id+"_otro"]||"")}"${isOn("Otro")?"":" hidden"}>` : "")
          + `</fieldset>`;
      }
    }
    html += `</section>`;
  }
  html += `<div class="actions"><div class="notice" id="status" hidden></div><button class="btn" type="submit" id="submit">Enviar respuestas</button></div>`;
  $("form").innerHTML = html;
  updateProgress();
}

function readField(el){
  const id = el.dataset.q;
  if (el.type==="checkbox"){
    state[id] = [...document.querySelectorAll(`input[name="${id}"]:checked`)].map(x=>x.value);
    const other = $(`f-${id}_otro`);
    if (other) other.hidden = !state[id].includes("Otro");
  } else { state[id] = el.value; }
  const box = el.closest(".q"); if (box) box.classList.remove("missing");
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); } catch(e){}
  updateProgress();
}
const answered = q => { const v = state[q.id]; return Array.isArray(v) ? v.length>0 : !!(v && String(v).trim()); };
function updateProgress(){
  const c = ALL.filter(answered).length;
  $("progress-label").textContent = `${c} de ${ALL.length} respondidas`;
  $("bar").style.width = (c/ALL.length*100)+"%";
}
$("form").addEventListener("input", e=>{ if (e.target.dataset.q) readField(e.target); });
$("form").addEventListener("change", e=>{ if (e.target.dataset.q) readField(e.target); });
function showStatus(msg){ const s=$("status"); s.textContent=msg; s.hidden=!msg; }

function buildBody(){
  const p = new URLSearchParams();
  for (const q of ALL){
    const v = state[q.id], key = "entry."+q.e;
    if (Array.isArray(v)){
      for (const x of v){
        if (x==="Otro"){
          p.append(key, "__other_option__");
          p.append(key+".other_option_response", (state[q.id+"_otro"]||"").trim() || "Otro");
        } else p.append(key, x);
      }
    } else if (v && String(v).trim()) p.append(key, String(v).trim());
  }
  p.append("pageHistory", "0,1,2,3");
  return p;
}

$("form").addEventListener("submit", async e=>{
  e.preventDefault();
  const missing = ALL.filter(q=>!q.optional && !answered(q));
  document.querySelectorAll(".q.missing").forEach(x=>x.classList.remove("missing"));
  if (missing.length){
    missing.forEach(q=>document.querySelector(`[data-box="${q.id}"]`)?.classList.add("missing"));
    const idx = ALL.indexOf(missing[0])+1;
    showStatus(`Te falta la pregunta ${idx}${missing.length>1?` y ${missing.length-1} más (en rojo)`:""}. Las de escribir son opcionales.`);
    document.querySelector(`[data-box="${missing[0].id}"]`)?.scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }
  const btn=$("submit"); btn.disabled=true; btn.textContent="Enviando…"; showStatus("");
  try{
    await fetch(FORM_URL, {method:"POST", mode:"no-cors", body:buildBody()});
    try{ localStorage.removeItem(DRAFT_KEY); localStorage.setItem(DONE_KEY, "1"); }catch(e){}
    $("view-form").hidden=true; $("view-thanks").hidden=false; window.scrollTo(0,0);
  }catch(err){
    showStatus("No se ha podido enviar. Revisa tu conexión y pulsa Enviar otra vez; tus respuestas siguen aquí.");
  }finally{ btn.disabled=false; btn.textContent="Enviar respuestas"; }
});

renderForm();
</script>
</body>
</html>
